name: Release macOS (.dmg)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach macOS .dmg assets to (e.g. v1.6.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  test-core:
    name: Test trasea-core on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Run trasea-core tests (release)
        run: cargo test --release -p trasea-core

      - name: Run trasea backend unit tests (release)
        run: cargo test --release -p trasea

  build-macos:
    name: Build macOS DMG (${{ matrix.arch_label }})
    needs: test-core
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_label: aarch64
          - target: x86_64-apple-darwin
            arch_label: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS .dmg (${{ matrix.target }})
        run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.macos.conf.json --bundles dmg

      - name: Compute SHA-256 & prepare upload artifacts
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH=$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ] || [ ! -f "$DMG_PATH" ]; then
            echo "No .dmg found for ${{ matrix.target }}" >&2
            exit 1
          fi
          DMG_NAME=$(basename "$DMG_PATH")
          SHA_FILE="${DMG_PATH}.sha256"
          (cd "$(dirname "$DMG_PATH")" && shasum -a 256 "$DMG_NAME" > "$(basename "$SHA_FILE")")
          cat "$SHA_FILE"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "sha_path=$SHA_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trasea-macos-${{ matrix.arch_label }}
          path: |
            ${{ steps.dmg.outputs.dmg_path }}
            ${{ steps.dmg.outputs.sha_path }}
          retention-days: 14

      - name: Upload .dmg & SHA-256 to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            echo "Skipping release upload: tag '$TAG' is not a v* release tag."
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet; creating draft release."
            gh release create "$TAG" --draft --title "Trasea $TAG" --notes "Automated macOS build for $TAG."
          fi
          gh release upload "$TAG" \
            "${{ steps.dmg.outputs.dmg_path }}" \
            "${{ steps.dmg.outputs.sha_path }}" \
            --clobber

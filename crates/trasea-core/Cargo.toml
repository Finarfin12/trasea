[package]
name = "trasea-core"
version = "1.8.2"
edition = "2021"
license = "MIT"
description = "Trasea core: raster illustration/logo to clean SVG/PDF/EPS/DXF (no UI)."

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
visioncortex = "0.8"
usvg = "0.45"
resvg = "0.45"
tiny-skia = "0.11"
svg2pdf = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"

[[bin]]
name = "trasea-cli"
path = "src/bin/trasea-cli.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dev-dependencies]
lopdf = "0.34"

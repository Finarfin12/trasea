[package]
name = "vektora-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Vektora core: raster illustration/logo to clean SVG/PDF (no UI)."

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
visioncortex = "0.8"
usvg = "0.45"
resvg = "0.45"
tiny-skia = "0.11"
svg2pdf = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bin]]
name = "vektora-cli"
path = "src/bin/vektora-cli.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dev-dependencies]
lopdf = "0.34"
